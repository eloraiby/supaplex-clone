[package]
name = "supaplex-clone"
version = "0.1.0"
edition = "2024"
default-run = "supaplex-clone"

[features]
default = []
unbundle = []
pocketgo = []

[dependencies]
libc = "0.2.175"
oplon = "1.0.0"
png = "0.18.1"

[target.'cfg(not(target_env = "uclibc"))'.dependencies]
sdl2 = "0.38.0"

[profile.release]
opt-level = "z"   # Optimize for size
lto = true        # Enable link-time optimization (aggressive dead code elimination)
codegen-units = 1 # Maximize optimization scope across the whole binary
panic = "abort"   # Required baseline strategy for removing unwinding mechanics
strip = true      # Strip all debuginfo and symbols automatically
